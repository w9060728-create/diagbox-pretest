<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiagBox 初階教育訓練 - 課前測驗</title>
<style>
  :root{
    --navy:#13294B; --navy2:#1F3A63; --maroon:#8C1D40; --gold:#C9932F;
    --bg:#F3F5F9; --card:#FFFFFF; --line:#E3E7EE; --txt:#1B1F27; --muted:#667085;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI","微軟正黑體",sans-serif; background:var(--bg); color:var(--txt);
  }
  .wrap{max-width:820px; margin:0 auto; padding:28px 18px 80px;}
  header{background:var(--navy); color:#fff; padding:28px 22px; border-radius:14px; margin-bottom:24px;}
  header h1{margin:0 0 6px; font-size:24px;}
  header p{margin:0; color:#B9C6E0; font-size:14px;}
  .meta-box{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:22px; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .meta-box label{display:block; font-size:13px; font-weight:700; color:var(--navy); margin-bottom:6px;}
  .meta-box input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px;}
  .q-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px;}
  .q-title{font-weight:700; font-size:15.5px; margin-bottom:10px; line-height:1.5;}
  .q-title .qno{color:var(--maroon); margin-right:4px;}
  .opt{display:block; padding:10px 12px; margin-bottom:8px; border:1.5px solid var(--line); border-radius:8px; cursor:pointer; font-size:14.5px; transition:.15s;}
  .opt:hover{border-color:var(--navy2); background:#F7F9FC;}
  .opt.selected{border-color:var(--navy); background:#EAF0FA; color:var(--navy); font-weight:700;}
  .opt input{margin-right:8px;}
  .submit-bar{position:sticky; bottom:0; background:linear-gradient(to top, var(--bg) 60%, transparent); padding:18px 0 4px;}
  #submitBtn{width:100%; padding:16px; font-size:17px; font-weight:700; color:#fff; background:linear-gradient(135deg, var(--navy), var(--navy2)); border:none; border-radius:12px; cursor:pointer;}
  #submitBtn:disabled{opacity:.5; cursor:not-allowed;}
  .progress{font-size:13px; color:var(--muted); text-align:center; margin-bottom:8px;}
  #resultScreen{display:none; text-align:center; padding:60px 20px;}
  #resultScreen h2{color:var(--navy);}
  .warn{color:var(--maroon); font-size:13px; text-align:center; margin-top:6px; display:none;}
</style>
</head>
<body>
<div class="wrap" id="quizScreen">
  <header>
    <h1>DiagBox 初階教育訓練 — 課前測驗</h1>
    <p>共 15 題。</p>
  </header>

  <div class="meta-box">
    <div><label>分店</label><input id="dealer" placeholder="例如：星聯板橋"></div>
    <div><label>姓名</label><input id="name" placeholder="請輸入本名"></div>
  </div>

  <div id="qContainer"></div>

  <div class="submit-bar">
    <div class="progress" id="progressText">已作答 0 / 15 題</div>
    <button id="submitBtn" onclick="submitQuiz()">提交課前測驗</button>
    <div class="warn" id="warnMsg">請完整填寫分店、姓名，並回答所有題目後再提交。</div>
  </div>
</div>

<div id="resultScreen">
  <h2>✅ 已送出，感謝作答</h2>
  <p>您的作答紀錄已送出，資料將用於課程學習成效分析，您可以關閉此頁面。</p>
</div>

<script>
/* =========================================================
   ⚠️ 上線前請完成以下設定 ⚠️
   1. 建立 Google 表單「DiagBox課前測驗回覆」，欄位：分店 / 姓名 / 得分 / 作答明細
   2. 用「取得預先填寫的連結」功能，取得每個欄位對應的 entry.xxxxxx 數字
   3. 將下方 FORM_URL 換成你表單的 formResponse 網址
      （原表單網址最後的 /viewform 換成 /formResponse）
   4. 將 ENTRY 物件裡的四個數字換成你實際的 entry ID
========================================================= */
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScdeXO4UsiKsK0nhbYF9NWScCJAOlGnYkvcN4VkcP-YAE70FQ/formResponse";
const ENTRY = {
  dealer: "entry.1787627730",   // 分店
  name:   "entry.1685927756",   // 姓名
  score:  "entry.135800857",    // 得分
  log:    "entry.1994547623",   // 作答明細
};

const questions = [
  { q: "DiagBox 是用來做什麼的工具？", o: ["車輛烤漆估價系統", "車輛診斷與維修支援工具", "零件庫存管理系統", "客戶關係管理系統"], a: 1 },
  { q: "下列何者「不是」DiagBox 的三大核心功能之一？", o: ["診斷", "即時監控", "進階設定", "遠端召回活動下載"], a: 3 },
  { q: "VCI（診斷接頭裝置）如果亮紅燈，代表什麼？", o: ["電池電量過高", "內部偵測到異常", "正在充電中", "已完成韌體更新"], a: 1 },
  { q: "新車交付客戶前，下列何者「不是」DiagBox 新車交付流程中會執行的項目？", o: ["選裝設備設定", "限定車速設定", "12V 電池狀態檢查", "遠端召回活動下載"], a: 3 },
  { q: "「限定車速」設定完成後，下列敘述何者正確？", o: ["客戶可隨時自行調整", "客戶無法自行更改車速限制", "每次發動車輛都需要重新設定", "只適用於柴油車"], a: 1 },
  { q: "12V 電池狀態檢查建議最早於交車前多久執行？", o: ["24 小時", "48 小時", "72 小時", "一週"], a: 1 },
  { q: "電池狀態檢查的第二次診斷，執行的前提是？", o: ["電池已充飽電", "客戶在場", "車輛正在行駛中", "已完成保養"], a: 0 },
  { q: "DiagBox 的「保養」模組，下列何者不屬於其功能範圍？", o: ["保養複位", "電池充電狀態測試", "空調評估", "作動器測試"], a: 3 },
  { q: "ECU 選單裡，「故障讀取」的主要用途是？", o: ["設定車速限制", "讀取控制單元的故障碼", "列印保養報告", "更改軟體語言"], a: 1 },
  { q: "當 DiagBox 顯示「calculateur inconnu」提示時，代表什麼？", o: ["電池電量不足", "系統偵測到未知的控制單元(ECU)", "網路連線中斷", "車輛已達保養里程"], a: 1 },
  { q: "作動器測試(Actuator Test) 的主要用途是？", o: ["更新 ECU 軟體版本", "強制驅動實體元件以判斷是否正常運作", "列印客戶保養手冊", "設定車輛顏色配置"], a: 1 },
  { q: "下列何者是 DiagBox 裡與「軟體下載／編程」相關的功能？", o: ["空調評估", "Download（下載）功能", "限定車速", "保養複位"], a: 1 },
  { q: "保養模組中的「維護」標籤，主要用於哪些項目？", o: ["保養、電池充電狀態測試、空調評估", "遠端召回活動下載", "作動器測試與故障碼清除", "ECU 軟體下載與編程"], a: 0 },
  { q: "電池檢測時，如果現場沒有 E-XTEQ 也沒有 Midtronics 測試儀，可以退而求其次使用什麼工具？", o: ["三用電表(Multimeter)", "游標卡尺", "扭力扳手", "示波器"], a: 0 },
  { q: "剛接觸 DiagBox 的技師，遇到不熟悉的操作步驟時，最適當的做法是？", o: ["憑感覺自行嘗試", "詢問資深同仁或查閱操作手冊", "直接略過該步驟", "交給客戶自行處理"], a: 1 },
];

const answers = new Array(questions.length).fill(null);
const qContainer = document.getElementById("qContainer");

questions.forEach((item, qi) => {
  const card = document.createElement("div");
  card.className = "q-card";
  const title = document.createElement("div");
  title.className = "q-title";
  title.innerHTML = `<span class="qno">${qi + 1}.</span>${item.q}`;
  card.appendChild(title);

  item.o.forEach((optText, oi) => {
    const label = document.createElement("label");
    label.className = "opt";
    label.innerHTML = `<input type="radio" name="q${qi}" value="${oi}"> ${optText}`;
    label.onclick = () => {
      answers[qi] = oi;
      card.querySelectorAll(".opt").forEach(el => el.classList.remove("selected"));
      label.classList.add("selected");
      updateProgress();
    };
    card.appendChild(label);
  });
  qContainer.appendChild(card);
});

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  document.getElementById("progressText").innerText = `已作答 ${answered} / ${questions.length} 題`;
}

function submitQuiz() {
  const dealer = document.getElementById("dealer").value.trim();
  const name = document.getElementById("name").value.trim();
  const warnEl = document.getElementById("warnMsg");
  const answered = answers.filter(a => a !== null).length;

  if (!dealer || !name || answered < questions.length) {
    warnEl.style.display = "block";
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    return;
  }
  warnEl.style.display = "none";

  let correct = 0;
  const logs = [];
  questions.forEach((item, qi) => {
    const isCorrect = answers[qi] === item.a;
    if (isCorrect) correct++;
    logs.push(`Q${qi + 1}:[${isCorrect ? "對" : "錯"}] 選:${item.o[answers[qi]]}${isCorrect ? "" : " / 正解:" + item.o[item.a]}`);
  });
  const scoreText = `${correct}/${questions.length}`;

  const params = {
    [ENTRY.dealer]: dealer,
    [ENTRY.name]: name,
    [ENTRY.score]: scoreText,
    [ENTRY.log]: logs.join(" | "),
  };

  sendToGoogleForm(params);
}

function sendToGoogleForm(params) {
  const iframeName = "hidden_iframe_" + Date.now();
  const iframe = document.createElement("iframe");
  iframe.name = iframeName;
  iframe.style.display = "none";
  document.body.appendChild(iframe);

  const form = document.createElement("form");
  form.method = "POST";
  form.action = FORM_URL;
  form.target = iframeName;
  form.style.display = "none";

  Object.entries(params).forEach(([key, value]) => {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = key;
    input.value = value;
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();

  document.getElementById("quizScreen").style.display = "none";
  document.getElementById("resultScreen").style.display = "block";
}
</script>
</body>
</html>
